name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you have in mind.

        > **Track editor feature?** File it in [heat-track-editor issues](https://github.com/w1nterl0ng/heat-track-editor/issues) instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the feature you'd like to see
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this feature be useful? What problem does it solve?
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Any other context, mockups, or references that might help
    validations:
      required: false
